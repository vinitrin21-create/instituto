<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist – Transição para Instituto Cidade Celeiro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f5f5f3; color: #1a1a1a; padding: 2rem; }
  .layout { max-width: 1100px; margin: 0 auto; display: flex; gap: 1.5rem; align-items: flex-start; }
  .main { flex: 1; background: #fff; border-radius: 12px; padding: 2rem; border: 1px solid #e0e0d8; }
  .sidebar { width: 240px; flex-shrink: 0; background: #fff; border-radius: 12px; padding: 1.5rem; border: 1px solid #e0e0d8; position: sticky; top: 2rem; }
  .sidebar-logo { width: 100%; margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid #e8e8e4; text-align: center; }
  .sidebar-logo img { max-width: 75%; height: auto; }
  .sidebar-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #888; padding-bottom: 8px; border-bottom: 1px solid #e8e8e4; margin-bottom: 12px; }
  .doc-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0ec; }
  .doc-item:last-child { border-bottom: none; }
  .doc-icon { width: 32px; height: 38px; flex-shrink: 0; background: #E1F5EE; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  .doc-icon svg { width: 16px; height: 16px; }
  .doc-info { flex: 1; }
  .doc-name { font-size: 13px; font-weight: 500; color: #1a1a1a; line-height: 1.3; margin-bottom: 4px; }
  .doc-link { font-size: 11px; color: #1D9E75; text-decoration: none; }
  .doc-link:hover { text-decoration: underline; }
  .cl-title { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 1.5rem; }
  .cl-progress { margin-bottom: 2rem; }
  .cl-progress-bar-bg { height: 5px; background: #e8e8e4; border-radius: 4px; overflow: hidden; }
  .cl-progress-bar { height: 5px; background: #1D9E75; border-radius: 4px; transition: width 0.3s; width: 0%; }
  .cl-progress-label { font-size: 12px; color: #888; margin-top: 6px; }
  .cl-section { margin-bottom: 1.75rem; }
  .cl-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #888; padding-bottom: 8px; border-bottom: 1px solid #e8e8e4; margin-bottom: 4px; }
  .cl-item { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 8px; transition: background 0.15s; position: relative; }
  .cl-item:hover { background: #f9f9f7; }
  .cl-item input[type=checkbox] { width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; accent-color: #1D9E75; }
  .cl-label { flex: 1; font-size: 14px; color: #1a1a1a; line-height: 1.5; transition: color 0.2s; }
  .cl-resp { font-size: 13px; border: none; border-bottom: 1px solid #ddd; background: transparent; color: #1a1a1a; padding: 2px 4px; width: 130px; outline: none; flex-shrink: 0; }
  .cl-resp:focus { border-bottom-color: #1D9E75; }
  .cl-resp::placeholder { color: #bbb; }
  .cl-item.done .cl-label { color: #bbb; text-decoration: line-through; }
  .badge-done { font-size: 10px; font-weight: 600; background: #E1F5EE; color: #0F6E56; padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }

  .help-btn { width: 18px; height: 18px; border-radius: 50%; background: #e8e8e4; border: none; cursor: pointer; font-size: 11px; font-weight: 700; color: #888; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background 0.15s; position: relative; }
  .help-btn:hover { background: #1D9E75; color: #fff; }

  .popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: center; justify-content: center; }
  .popup-overlay.active { display: flex; }
  .popup-box { background: #fff; border-radius: 12px; padding: 1.5rem; max-width: 440px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.12); position: relative; }
  .popup-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #1D9E75; margin-bottom: 6px; }
  .popup-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 12px; line-height: 1.4; }
  .popup-section { margin-bottom: 12px; }
  .popup-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 4px; }
  .popup-text { font-size: 13px; color: #444; line-height: 1.6; }
  .popup-close { position: absolute; top: 12px; right: 14px; background: none; border: none; font-size: 18px; cursor: pointer; color: #aaa; line-height: 1; }
  .popup-close:hover { color: #333; }

  .sidebar-tarefas { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid #e8e8e4; }
  .sidebar-tarefas-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #888; padding-bottom: 8px; border-bottom: 1px solid #e8e8e4; margin-bottom: 10px; }
  .tarefas-row { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f5f5f3; }
  .tarefas-row:last-child { border-bottom: none; }
  .tarefas-fraction { font-size: 13px; font-weight: 700; color: #1D9E75; min-width: 36px; text-align: right; white-space: nowrap; }
  .tarefas-fraction .done-count { font-size: 16px; }
  .tarefas-fraction .total-count { font-size: 11px; color: #aaa; font-weight: 500; }
  .tarefas-name { font-size: 13px; color: #1a1a1a; }

  .saving-indicator { position: fixed; bottom: 20px; right: 20px; background: #1D9E75; color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  .saving-indicator.show { opacity: 1; }

  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .layout { display: block; }
    .sidebar { display: none; }
    .main { border: none; padding: 1rem; }
    .cl-item:hover { background: transparent; }
    .help-btn { display: none; }
  }
</style>
</head>

// ─── STATE MANAGEMENT ─────────────────────────────────────────────────────────
// Flat map for quick lookup: id → {done, resp}
const stateMap = {};
data.forEach(section => {
  section.items.forEach(item => {
    stateMap[item.id] = { done: item.initialDone, resp: item.resp };
  });
});

// ─── STORAGE ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'checklist-instituto-celeiro-v2';

async function loadFromStorage() {
  try {
    const result = await window.storage.get(STORAGE_KEY, true); // shared=true
    if (result && result.value) {
      const saved = JSON.parse(result.value);
      // Merge saved state into stateMap (only override done status)
      Object.keys(saved).forEach(id => {
        if (stateMap[id] !== undefined) {
          stateMap[id].done = saved[id];
        }
      });
    }
  } catch (e) {
    // Key doesn't exist yet or error — use initialDone defaults
  }
}

async function saveToStorage() {
  try {
    // Save only the done flags (keyed by id)
    const toSave = {};
    Object.keys(stateMap).forEach(id => {
      toSave[id] = stateMap[id].done;
    });
    await window.storage.set(STORAGE_KEY, JSON.stringify(toSave), true); // shared=true
    showSavingIndicator();
  } catch (e) {
    console.error('Storage save error:', e);
  }
}

function showSavingIndicator() {
  const el = document.getElementById('saving-indicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

// ─── BUILD UI ─────────────────────────────────────────────────────────────────
const total = data.reduce((s, c) => s + c.items.length, 0);
const container = document.getElementById('checklist');
const checkboxMap = {}; // id → checkbox element

function buildChecklist() {
  container.innerHTML = '';
  data.forEach(section => {
    const sec = document.createElement('div');
    sec.className = 'cl-section';

    const title = document.createElement('div');
    title.className = 'cl-section-title';
    title.textContent = section.cat;
    sec.appendChild(title);

    section.items.forEach(item => {
      const isDone = stateMap[item.id].done;

      const row = document.createElement('div');
      row.className = 'cl-item' + (isDone ? ' done' : '');
      row.dataset.id = item.id;

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = isDone;
      checkboxMap[item.id] = cb;

      const lbl = document.createElement('span');
      lbl.className = 'cl-label';
      lbl.textContent = item.text;

      cb.addEventListener('change', async () => {
        stateMap[item.id].done = cb.checked;
        row.classList.toggle('done', cb.checked);
        updateProgress();
        updateTarefas();
        await saveToStorage();
      });

      row.appendChild(cb);
      row.appendChild(lbl);

      // Help button
      if (helps[item.text]) {
        const btn = document.createElement('button');
        btn.className = 'help-btn';
        btn.textContent = '?';
        btn.title = 'Saiba mais';
        btn.addEventListener('click', () => openPopup(item.text));
        row.appendChild(btn);
      }

      // Responsável
      const respSpan = document.createElement('span');
      respSpan.style.cssText = 'font-size:12px;color:#aaa;white-space:nowrap;flex-shrink:0;';
      respSpan.textContent = item.resp;
      row.appendChild(respSpan);

      if (isDone) {
        const badge = document.createElement('span');
        badge.className = 'badge-done';
        badge.textContent = 'Concluído';
        row.insertBefore(badge, respSpan);
      }

      sec.appendChild(row);
    });

    container.appendChild(sec);
  });
}

// Live-update badge visibility when checkbox changes
function syncRowBadge(id) {
  const row = document.querySelector(`.cl-item[data-id="${id}"]`);
  if (!row) return;
  const isDone = stateMap[id].done;
  // Remove existing badge if any
  const existingBadge = row.querySelector('.badge-done');
  if (isDone && !existingBadge) {
    const badge = document.createElement('span');
    badge.className = 'badge-done';
    badge.textContent = 'Concluído';
    const respSpan = row.querySelector('span[style]');
    row.insertBefore(badge, respSpan);
  } else if (!isDone && existingBadge) {
    existingBadge.remove();
  }
}

// Override checkbox event to also sync badge
function buildChecklistWithBadgeSync() {
  buildChecklist();
  // Re-attach badge sync to each checkbox
  data.forEach(section => {
    section.items.forEach(item => {
      const cb = checkboxMap[item.id];
      if (cb) {
        cb.addEventListener('change', () => {
          syncRowBadge(item.id);
        });
      }
    });
  });
}

// ─── PROGRESS ─────────────────────────────────────────────────────────────────
function updateProgress() {
  const done = Object.values(stateMap).filter(s => s.done).length;
  const pct = Math.round((done / total) * 100);
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('prog-label').textContent = done + ' de ' + total + ' tarefas concluídas';
}

// ─── TAREFAS SIDEBAR ──────────────────────────────────────────────────────────
const responsaveis = ['Vinicius Trindade', 'Fábio Dudus', 'Gisele Carelli', 'Claudecir Bianco', 'Diretoria'];

function countTarefas() {
  const counts = {};
  responsaveis.forEach(r => counts[r] = { done: 0, total: 0 });

  data.forEach(section => {
    section.items.forEach(item => {
      const r = item.resp;
      if (!counts[r]) counts[r] = { done: 0, total: 0 };
      counts[r].total++;
      if (stateMap[item.id].done) counts[r].done++;
    });
  });
  return counts;
}

function updateTarefas() {
  const counts = countTarefas();
  const listEl = document.getElementById('tarefas-list');
  listEl.innerHTML = '';

  const order = ['Vinicius Trindade', 'Fábio Dudus', 'Gisele Carelli', 'Claudecir Bianco'];
  order.forEach(name => {
    const c = counts[name];
    if (!c || c.total === 0) return;
    const row = document.createElement('div');
    row.className = 'tarefas-row';
    row.innerHTML = `
      <span class="tarefas-fraction">
        <span class="done-count">${c.done}</span><span class="total-count">/${c.total}</span>
      </span>
      <span class="tarefas-name">${name}</span>
    `;
    listEl.appendChild(row);
  });
}

// ─── POPUP ────────────────────────────────────────────────────────────────────
function openPopup(key) {
  const h = helps[key];
  if (!h) return;
  document.getElementById('popup-title').textContent = key;
  document.getElementById('popup-oque').textContent = h.oque;
  document.getElementById('popup-ofazer').textContent = h.ofazer;
  document.getElementById('popup-overlay').classList.add('active');
}
function closePopup() {
  document.getElementById('popup-overlay').classList.remove('active');
}
document.getElementById('popup-overlay').addEventListener('click', function(e) {
  if (e.target === this) closePopup();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  await loadFromStorage();
  buildChecklistWithBadgeSync();
  updateProgress();
  updateTarefas();
}

init();
</script>
